name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Build DATABASE_URL / DIRECT_URL in the runner so you can use simple secrets
      # (SUPABASE_PROJECT_REF + SUPABASE_DB_PASSWORD) instead of pasting full URLs.
      - name: Configure deploy environment
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_REGION: ${{ secrets.SUPABASE_DB_REGION }}
          SUPABASE_POOLER_HOST: ${{ secrets.SUPABASE_POOLER_HOST }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          AUTH_GITHUB_ID: ${{ secrets.AUTH_GITHUB_ID }}
          AUTH_GITHUB_SECRET: ${{ secrets.AUTH_GITHUB_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          MICROSOFT_TENANT_ID: ${{ secrets.MICROSOFT_TENANT_ID }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          CUSTOM_DOMAIN: ${{ secrets.CUSTOM_DOMAIN }}
          ACM_CERT_ARN: ${{ secrets.ACM_CERT_ARN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_S3_ACCESS_KEY_ID: ${{ secrets.AWS_S3_ACCESS_KEY_ID }}
          AWS_S3_SECRET_ACCESS_KEY: ${{ secrets.AWS_S3_SECRET_ACCESS_KEY }}
          AWS_S3_REGION: ${{ secrets.AWS_S3_REGION }}
          AWS_S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME }}
        run: |
          set -euo pipefail

          # Lambda cannot reach db.<ref>.supabase.co — always use the Supabase pooler in prod.
          if [ -n "${SUPABASE_PROJECT_REF:-}" ] && [ -n "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "Building pooler database URLs for AWS Lambda."
            ENC=$(python3 -c 'import urllib.parse, os; print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))')
            POOLER_HOST="${SUPABASE_POOLER_HOST:-aws-1-ap-southeast-2.pooler.supabase.com}"
            # Supabase pooler requires username postgres.<project-ref> (tenant id).
            DATABASE_URL="postgresql://postgres.${SUPABASE_PROJECT_REF}:${ENC}@${POOLER_HOST}:6543/postgres?pgbouncer=true&connection_limit=1"
            DIRECT_URL="postgresql://postgres.${SUPABASE_PROJECT_REF}:${ENC}@${POOLER_HOST}:5432/postgres"
          elif [ -n "${DATABASE_URL:-}" ] && [ -n "${DIRECT_URL:-}" ]; then
            if echo "$DATABASE_URL" | grep -q '@db\.'; then
              echo "::error::DATABASE_URL uses db.<ref>.supabase.co which Lambda cannot reach. Remove DATABASE_URL/DIRECT_URL secrets and set SUPABASE_PROJECT_REF + SUPABASE_DB_PASSWORD instead."
              exit 1
            fi
            echo "Using DATABASE_URL and DIRECT_URL repository secrets."
          else
            echo "::error::Missing database secrets. Add EITHER:"
            echo "::error::  • DATABASE_URL + DIRECT_URL (full connection strings)"
            echo "::error::  OR"
            echo "::error::  • SUPABASE_PROJECT_REF (e.g. qgofdiippdlcbtbpqlas) + SUPABASE_DB_PASSWORD (plain password)"
            exit 1
          fi

          missing=""
          for name in NEXTAUTH_SECRET NEXTAUTH_URL AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION; do
            eval "val=\${$name:-}"
            if [ -z "$val" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub repository secrets:$missing"
            exit 1
          fi

          {
            echo "DATABASE_URL=$DATABASE_URL"
            echo "DIRECT_URL=$DIRECT_URL"
            echo "NEXTAUTH_SECRET=$NEXTAUTH_SECRET"
            echo "NEXTAUTH_URL=$NEXTAUTH_URL"
            echo "AUTH_GITHUB_ID=${AUTH_GITHUB_ID:-}"
            echo "AUTH_GITHUB_SECRET=${AUTH_GITHUB_SECRET:-}"
            echo "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}"
            echo "GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}"
            echo "MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID:-}"
            echo "MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET:-}"
            echo "MICROSOFT_TENANT_ID=${MICROSOFT_TENANT_ID:-}"
            echo "LINKEDIN_CLIENT_ID=${LINKEDIN_CLIENT_ID:-}"
            echo "LINKEDIN_CLIENT_SECRET=${LINKEDIN_CLIENT_SECRET:-}"
            echo "CUSTOM_DOMAIN=${CUSTOM_DOMAIN:-www.taskers.in}"
            echo "ACM_CERT_ARN=${ACM_CERT_ARN:-}"
            echo "SMTP_HOST=${SMTP_HOST:-}"
            echo "SMTP_PORT=${SMTP_PORT:-}"
            echo "SMTP_USER=${SMTP_USER:-}"
            echo "SMTP_PASS=${SMTP_PASS:-}"
            echo "SMTP_FROM=${SMTP_FROM:-}"
            echo "AWS_S3_ACCESS_KEY_ID=${AWS_S3_ACCESS_KEY_ID:-}"
            echo "AWS_S3_SECRET_ACCESS_KEY=${AWS_S3_SECRET_ACCESS_KEY:-}"
            echo "AWS_S3_REGION=${AWS_S3_REGION:-ap-south-1}"
            echo "AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME:-}"
          } >> "$GITHUB_ENV"

          echo "Deploy environment configured."

      # Schema is applied locally via `npm run db:push`. CI skip avoids pooler/region issues.
      - name: Push database schema (optional)
        continue-on-error: true
        run: npx prisma db push || echo "db push skipped — ensure schema was pushed locally"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy with SST
        run: |
          npx sst unlock --stage prod 2>/dev/null || true
          npx sst deploy --stage prod
