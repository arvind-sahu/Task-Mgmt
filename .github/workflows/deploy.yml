name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Build DATABASE_URL / DIRECT_URL in the runner so you can use simple secrets
      # (SUPABASE_PROJECT_REF + SUPABASE_DB_PASSWORD) instead of pasting full URLs.
      - name: Configure deploy environment
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_REGION: ${{ secrets.SUPABASE_DB_REGION }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail

          if [ -n "${DATABASE_URL:-}" ] && [ -n "${DIRECT_URL:-}" ]; then
            echo "Using DATABASE_URL and DIRECT_URL repository secrets."
          elif [ -n "${SUPABASE_PROJECT_REF:-}" ] && [ -n "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "Building database URLs from SUPABASE_PROJECT_REF and SUPABASE_DB_PASSWORD."
            ENC=$(python3 -c 'import urllib.parse, os; print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))')
            REGION="${SUPABASE_DB_REGION:-ap-south-1}"
            # GitHub Actions cannot reach db.<ref>.supabase.co reliably — use the pooler.
            DATABASE_URL="postgresql://postgres.${SUPABASE_PROJECT_REF}:${ENC}@aws-0-${REGION}.pooler.supabase.com:6543/postgres?pgbouncer=true&connection_limit=1"
            DIRECT_URL="postgresql://postgres.${SUPABASE_PROJECT_REF}:${ENC}@aws-0-${REGION}.pooler.supabase.com:5432/postgres"
          else
            echo "::error::Missing database secrets. Add EITHER:"
            echo "::error::  • DATABASE_URL + DIRECT_URL (full connection strings)"
            echo "::error::  OR"
            echo "::error::  • SUPABASE_PROJECT_REF (e.g. qgofdiippdlcbtbpqlas) + SUPABASE_DB_PASSWORD (plain password)"
            exit 1
          fi

          missing=""
          for name in NEXTAUTH_SECRET NEXTAUTH_URL AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION; do
            eval "val=\${$name:-}"
            if [ -z "$val" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub repository secrets:$missing"
            exit 1
          fi

          {
            echo "DATABASE_URL=$DATABASE_URL"
            echo "DIRECT_URL=$DIRECT_URL"
            echo "NEXTAUTH_SECRET=$NEXTAUTH_SECRET"
            echo "NEXTAUTH_URL=$NEXTAUTH_URL"
          } >> "$GITHUB_ENV"

          echo "Deploy environment configured."

      - name: Push database schema
        run: npx prisma db push

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy with SST
        run: npx sst deploy --stage prod
